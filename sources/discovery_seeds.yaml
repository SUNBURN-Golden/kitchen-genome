keyword_search:
  endpoint: "https://www.bing.com/news/search?format=rss&setlang=ko&q={q}"   # same lead source as crawler/crawl.py (RSS, not scraping HTML)
  keywords: [오픈, 이전, 폐업, 출신, 수셰프, 헤드셰프]
  years_back: 1                    # current year and N previous
  keyword_weight: {폐업: 1.0, 이전: 0.95, 오픈: 0.9, 수셰프: 0.8, 헤드셰프: 0.8, 출신: 0.7}

mother_kitchens:
  layeon: {ko: [라연], en: [La Yeon], context_ko: 신라호텔, context_en: Shilla}
  mitou: {ko: [미토우], en: [Mitou]}
  allen: {ko: [레스토랑 알렌], en: [Restaurant Allen]}
  allaprima: {ko: [알라 프리마, 알라프리마], en: [Alla Prima]}
  gaon: {ko: [가온], en: [Gaon], context_ko: 한식당, context_en: Seoul}
  sushicho: {ko: [스시조], en: [Sushi Cho], context_ko: 조선호텔}

directories:
  - id: wikipedia_ko_bw_chef
    url: "https://ko.wikipedia.org/wiki/%ED%9D%91%EB%B0%B1%EC%9A%94%EB%A6%AC%EC%82%AC:_%EC%9A%94%EB%A6%AC_%EA%B3%84%EA%B8%89_%EC%A0%84%EC%9F%81"
    kind: reference
    note: "chef/restaurant roster of a public TV competition; reference tier (not independent for 'verified')"
  - id: wikipedia_ko_michelin
    url: "https://ko.wikipedia.org/wiki/%EB%AF%B8%EC%89%90%EB%A6%B0_%EA%B0%80%EC%9D%B4%EB%93%9C"
    kind: reference
  - id: lotte_hotels_dining
    url: "https://www.lottehotel.com/seoul-hotel/ko/dining.html"
    kind: official_directory
    browser: true                  # renderer hint for recording unavailable HTTP shells
    note: "HTTP-only; defer an unreadable JS shell until a guarded renderer exists"
  - id: michelin_kr_selection
    url: "https://guide.michelin.com/kr/ko/selection/south-korea/restaurants"
    kind: official_directory

feeds:
  - {country: KR, url: "https://www.hotelrestaurant.co.kr/rss/allArticle.xml", kind: rss}

sitemaps:
  - {country: KR, url: "https://www.hotelrestaurant.co.kr/sitemap.xml", lookback_days: 45}
  - {country: KR, url: "https://www.foodnews.news/sitemap.xml", lookback_days: 45}
  - {country: KR, url: "https://bakerynews.co.kr/sitemap.xml", lookback_days: 45}

caps:
  relevance_floor: 0.30

official_chain:
  subpage_hints: [about, story, chef, menu, news, press, notice, history, 소개, 메뉴, 셰프, 스토리, 공지]
  sns_hosts: [instagram.com, facebook.com, youtube.com, blog.naver.com, naver.me, tiktok.com, x.com, twitter.com]
  booking_hosts: [catchtable.co.kr, catchtable.net, tabling.co.kr, resy.com, opentable.com, toasttab.com, tock.com, exploretock.com, place.naver.com]
